name: MAGUISSI BIRR Android test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "constants/**"
      - "features/**"
      - "services/**"
      - "types/**"
      - "utils/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "eas.json"
      - ".github/workflows/android-test-apk.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "constants/**"
      - "features/**"
      - "services/**"
      - "types/**"
      - "utils/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "eas.json"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

concurrency:
  group: maguissi-birr-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and cold-start test Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses non-interactively
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript and tests
        run: |
          npm run typecheck
          npm test -- --passWithNoTests

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Install and cold-start app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p sn.maguissi.birr 1
            sleep 20
            if ! adb shell pidof sn.maguissi.birr >/dev/null; then
              echo "MAGUISSI BIRR process is not running after launch."
              adb logcat -d -v threadtime -s AndroidRuntime ReactNativeJS Expo
              exit 1
            fi
            if adb logcat -d -v brief -s AndroidRuntime ReactNativeJS | grep -E "FATAL EXCEPTION|Fatal signal|Unhandled JS Exception"; then
              echo "Crash signature detected in Android logs."
              adb logcat -d -v threadtime -s AndroidRuntime ReactNativeJS Expo
              exit 1
            fi
            echo "Cold-start smoke test passed: process remains alive and no fatal signature was found."

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: maguissi-birr-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
